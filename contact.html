<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html">TravelBloom</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a class="active" href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <main class="page">
    <h1>Contact Us</h1>
    <p>Have a question or need help planning your trip? Send us a message and we'll reply as soon as we can.</p>

    <form class="contact" id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Submit</button>
      <p id="formStatus"></p>
    </form>
  </main>

  <footer>&copy; 2026 TravelBloom. All rights reserved.</footer>

  <script src="script.js"></script>
</body>
</html>
